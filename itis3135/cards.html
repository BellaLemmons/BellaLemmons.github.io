<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bella Lemmons's Bright-colored Lizard | ITIS3135 | Cards</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="icon" type="image/x-icon" href="../images/spaceinvader.ico">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    </head>
    
<body>
    <div data-include="components/header.html"></div>

    <main>
    <h2>Cards</h2>
<!--Div and ID used for the grid organization for the images.-->
    <div id="cards">
        <div>
            <img height="320" width="240"  src="images/ace-spades.png" alt="The ace of spades card of the deck. The spade and the text are pink, and the single star in the middle is orange.">
        </div>
        <div>
            <img height="320" width="240"  src="images/ace-clubs.png" alt="The ace of clubs card of the deck. The spade and the text are pink, and the single star in the middle is purple.">
        </div>
        <div>
            <img height="320" width="240" src="images/ace-diamonds.png" alt="The ace of diamonds card of the deck. The spade and the text are orange, and the single star in the middle is yellow.">
        </div>
        <div>
            <img height="320" width="240"  src="images/ace-hearts.png" alt="The ace of hearts card of the deck. The spade and the text are orange, and the single star in the middle is blue.">
        </div>
        <div>
            <img height="320" width="240" src="images/joker-card.png" alt="The Joker card of the deck. The text is pink, and the symbol in the middle is the same as the logo.">
        </div>
        <div>
            <img height="320" width="240"  src="images/card-back.png" alt="The design that is on the back of the deck. Several multicolored stars are spaced out on the surface with smaller white stars between.">
        </div>
    </div>
    
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
