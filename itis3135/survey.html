<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bella Lemmons's Bright-colored Lizard | ITIS3135 | Survey</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/default.css">
        <link rel="icon" type="image/x-icon" href="../images/spaceinvader.ico">
        <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    </head>
    
<body>
    <div data-include="components/header.html"></div>

    <main>
    <h2>Survey</h2>

    <p>This is where the survey will go.</p>
    <!--ID is used for connecting labels to the input types.-->
        <form>
            <fieldset>
                <legend>Form Stuff:</legend>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="person@gmail.com"><br><br>
                <label for="input">Type Here:</label><br>
                <textarea name="input" id="input" placeholder="Text goes here."></textarea><br>
                <p class="left">Checkboxes:</p>
                <input type="checkbox" id="option1">
                <label for="option1">Option 1</label>
                <input type="checkbox" id="option2">
                <label for="option2">Option 2</label>
                <input type="checkbox" id="option3">
                <label for="option3">Option 3</label>
                
                <br><br>
                <input type="submit">
            </fieldset>
        
        </form>
    
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
